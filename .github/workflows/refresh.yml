name: Cockpit-Refresh

# Baut cockpit_data.json neu und committet es. Streamlit Cloud zieht den
# Commit automatisch.
#
# Warum eine Schleife statt "*/15" im Cron: GitHub drosselt geplante Laeufe
# stark. Mit "*/15" kamen real nur alle 70 bis 130 Minuten Daten an, ueber
# Nacht lagen 13 Stunden dazwischen. Deshalb startet der Cron hier nur noch
# einen Dauerlaeufer, der intern alle 10 Minuten pullt. Der Takt haengt damit
# nicht mehr an GitHubs Warteschlange.

on:
  schedule:
    # Stuendlicher Anker, 5-18 UTC = 7-20 Uhr MESZ. Bewusst redundant: faellt
    # ein Anker der Drosselung zum Opfer, laeuft der vorherige Job weiter.
    - cron: "4 5-18 * * 1-5"
  workflow_dispatch:

# Immer nur eine Kette. Ein neuer Anker loest den laufenden Job ab, damit die
# Kette sich stuendlich selbst heilt und nie haengen bleibt. Abgeloeste Laeufe
# erscheinen in der Historie als "cancelled", das ist der Normalfall und kein
# Fehler.
concurrency:
  group: cockpit-refresh
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 190
    env:
      TZ: Europe/Berlin
      AIRCALL_API_ID: ${{ secrets.AIRCALL_API_ID }}
      AIRCALL_API_TOKEN: ${{ secrets.AIRCALL_API_TOKEN }}
      RECRUITCRM_API_TOKEN: ${{ secrets.RECRUITCRM_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Alle 10 Minuten aktualisieren
        run: |
          # GitHub startet die Shell mit "bash -e": ohne "set +e" beendet jeder
          # fehlschlagende Befehl (Push-Race, API-Timeout) sofort den ganzen Job
          # und die Kette steht bis zum naechsten stuendlichen Anker still.
          set +e
          set -uo pipefail
          git config user.name  "cockpit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          INTERVALL=600
          # Nach 3 Stunden aussteigen; der naechste stuendliche Anker uebernimmt.
          SCHLUSS=$(( $(date +%s) + 3*3600 ))

          while :; do
            TAG=$(date +%u); STUNDE=$(date +%H)
            if [ "$TAG" -gt 5 ] || [ "$((10#$STUNDE))" -lt 7 ] || [ "$((10#$STUNDE))" -ge 20 ]; then
              echo "Ausserhalb des Zeitfensters (Mo-Fr 7-20 Uhr). Job beendet."
              break
            fi

            echo "::group::Lauf $(date '+%H:%M:%S')"

            # Streamlit Community Cloud legt Apps ohne Traffic schlafen. Ein
            # wachgehaltener Container erspart Rico die 30-Sekunden-Weckzeit.
            curl -s -o /dev/null -m 30 "https://synergy-tracker.streamlit.app/" || true

            if python build_cache.py; then
              # cockpit_data.json wird bei jedem Lauf komplett neu erzeugt, ein
              # Merge der beiden Staende ist also nie sinnvoll: unserer ist der
              # juengere und gewinnt immer. Fruehr stand hier "git pull --rebase";
              # ueberlappten sich zwei Laeufe (ein abgeloester Job pusht noch,
              # waehrend der neue schon baut), lief das in einen Rebase-Konflikt
              # und riss die ganze Kette ab. Stattdessen setzen wir hart auf den
              # Remote-Stand, legen unsere frische Datei darauf und pushen; beim
              # Rennen um denselben Push wiederholen wir das einfach.
              cp cockpit_data.json "$RUNNER_TEMP/frisch.json"
              for VERSUCH in 1 2 3; do
                git fetch -q origin main
                git reset -q --hard origin/main
                cp "$RUNNER_TEMP/frisch.json" cockpit_data.json

                if git diff --quiet cockpit_data.json; then
                  echo "Keine Aenderung."
                  break
                fi

                git add cockpit_data.json
                git commit -q -m "Auto-refresh cockpit data $(date '+%Y-%m-%d %H:%M')"
                if git push -q origin HEAD:main; then
                  echo "Gepusht."
                  break
                fi
                echo "Push-Rennen verloren (Versuch $VERSUCH von 3), neuer Anlauf."
              done
            else
              # Ein einzelner Fehlschlag (API-Timeout, Rate-Limit) darf die
              # Kette nicht abreissen lassen.
              echo "::warning::build_cache.py fehlgeschlagen, naechster Versuch in $((INTERVALL/60)) Min."
            fi
            echo "::endgroup::"

            if [ $(( $(date +%s) + INTERVALL )) -gt "$SCHLUSS" ]; then
              echo "Maximale Joblaufzeit erreicht, der naechste Anker uebernimmt."
              break
            fi
            sleep "$INTERVALL"
          done
