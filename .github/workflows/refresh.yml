name: Cockpit-Refresh

# Baut cockpit_data.json neu und committet es. Streamlit Cloud zieht den
# Commit automatisch. Laeuft in der GitHub-Cloud, damit die Zahlen auch
# aktuell sind, wenn Ricos MacBook schlaeft.

on:
  schedule:
    # GitHub-Cron ist immer UTC. 5-19 UTC entspricht 7-21 Uhr MESZ bzw.
    # 6-20 Uhr MEZ. Die Tagesgrenzen selbst rechnet build_cache.py ueber
    # TZ=Europe/Berlin, die Randstunden schaden also nicht.
    - cron: "*/15 5-19 * * 1-5"
  workflow_dispatch:

# Nie zwei Laeufe gleichzeitig, sonst kollidieren die Pushes.
concurrency:
  group: cockpit-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Europe/Berlin
      AIRCALL_API_ID: ${{ secrets.AIRCALL_API_ID }}
      AIRCALL_API_TOKEN: ${{ secrets.AIRCALL_API_TOKEN }}
      RECRUITCRM_API_TOKEN: ${{ secrets.RECRUITCRM_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache neu bauen
        run: python build_cache.py

      - name: Committen und pushen, wenn sich etwas geaendert hat
        run: |
          if git diff --quiet cockpit_data.json; then
            echo "Keine Aenderung, nichts zu tun."
            exit 0
          fi
          git config user.name  "cockpit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cockpit_data.json
          git commit -m "Auto-refresh cockpit data $(date '+%Y-%m-%d %H:%M')"
          # Falls der Mac zwischendurch gepusht hat: erst rebasen, dann pushen
          git pull --rebase --autostash origin main
          git push
